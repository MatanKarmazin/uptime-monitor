apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-redis
  template:
    metadata:
      labels:
        app: uptime-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis # This matches the network hostname the API will look for!
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: uptime-redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor-api
  labels:
    app: uptime-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptime-api
  template:
    metadata:
      labels:
        app: uptime-api
    spec:
      containers:
      - name: api
        image: 365857660246.dkr.ecr.eu-central-1.amazonaws.com/uptime-monitor-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: SLACK_WEBHOOK_URL
          value: "YOUR_SLACK_WEBHOOK_URL_HERE"
        - name: REDIS_HOST
          value: "redis" # Tells Python to talk to our new Kubernetes Redis service
        - name: PYTHONUNBUFFERED
          value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: uptime-monitor-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: uptime-api