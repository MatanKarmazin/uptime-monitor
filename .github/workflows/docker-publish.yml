name: Push to Amazon ECR

on:
  workflow_dispatch:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'       # Don't run if only markdown files change
      - 'docs/**'     # Don't run if only images in the docs folder change

# We define these as environment variables so they are easy to change later
env:
  AWS_REGION: "eu-central-1"                   # Extracted from your ECR URL
  ECR_REPOSITORY: "uptime-monitor-api"         # The name of the repo you made in Terraform

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        # This dynamically grabs the URL you gave me: 365857660246.dkr.ecr.eu-central-1.amazonaws.com
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # We tag the image with the unique Git commit hash so we can track exactly which code is running
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building the Docker image..."
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "Tagging as latest..."
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest