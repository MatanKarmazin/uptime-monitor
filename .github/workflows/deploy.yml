name: Continuous Deployment

# This tells GitHub to run this workflow ONLY when code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        # We use a pre-built community action designed specifically for SSH connections
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # These are the exact commands the action will run inside your EC2 server
            cd ~/uptime-monitor
            git pull origin main
            sudo docker compose up -d --build