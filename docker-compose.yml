version: '3.8'

services:
  api:
    build: .
    container_name: uptime-monitor-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: uptime-monitor-redis
    ports:
      - "6379:6379"
    restart: unless-stopped